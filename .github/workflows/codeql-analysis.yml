name: "CodeQL"

on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/00-RELEASENOTES'
      - '**/COPYING'
  schedule:
    # run weekly new vulnerability was added to the database
    - cron: '0 3 * * 0'

concurrency:
  group: codeql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    # cpp autobuild OOMed the 8 GiB runner once and then failed cmake
    # autobuild under the 5G heavy slice. Keep this job on GitHub-hosted.
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.repository == 'valkey-io/valkey'
    permissions:
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['cpp']

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c793b717bc78562f491db7b0e93a3a178b099162 # v4.32.5
        with:
          languages: ${{ matrix.language }}

      # cmake autobuild fails with "server.h: No such file or directory"
      # (src/tier/tier.h) on both the self-hosted runner and ubuntu-latest,
      # and is already red on unstable. The project is built with make.
      - name: Build
        run: make -j"$(nproc)"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@c793b717bc78562f491db7b0e93a3a178b099162 # v4.32.5
